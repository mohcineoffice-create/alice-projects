<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>IM JX - Metallurgy Lab Node</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>html,body{overscroll-behavior-y:contain;}</style>
    <script>window.IMJX_PAGE = { department: "METALLURGIE", page: "OPER", roles: ["operator"] };</script>
    <script src="/shared/im-jx-client.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-2 md:p-4 font-sans select-none">

    <div class="max-w-4xl mx-auto bg-slate-800 rounded-xl shadow-2xl border border-slate-700 overflow-hidden mb-12">
        <div class="bg-slate-950 p-4 flex justify-between items-center border-b-2 border-orange-500">
            <div>
                <h1 class="text-lg font-bold text-orange-400 tracking-wider flex items-center gap-2">
                    <span>IM JX - Metallurgy Lab Node</span>
                    <span id="syncIndicator" class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse" title="System Synced"></span>
                </h1>
                <p id="syncStatusText" class="text-[9px] text-emerald-400 uppercase font-mono tracking-widest">Cloud Connection: Ready</p>
            </div>
            <div class="flex flex-col items-end gap-1">
                <input type="date" id="repDate" onchange="triggerAutoSync()" class="bg-slate-800 text-xs p-1 rounded border border-slate-600 text-white font-mono outline-none">
                <span id="liveClock" class="text-[10px] font-mono text-slate-400">00:00:00</span>
            </div>
        </div>

        <div class="flex border-b border-slate-700 bg-slate-900/50 text-xs font-bold text-center">
            <button type="button" onclick="switchTab('hard-section', this)" id="tab-hard" class="flex-1 py-3 bg-slate-800 text-orange-400 border-b-2 border-orange-500 transition-all">HARDNESS & HEAT TREATMENT</button>
            <button type="button" onclick="switchTab('surf-section', this)" id="tab-surf" class="flex-1 py-3 text-slate-400 border-b-2 border-transparent transition-all">ROUGHNESS & MICRO-CRACKS</button>
            <button type="button" onclick="switchTab('reclam-section', this)" id="tab-reclam" class="flex-1 py-3 text-slate-400 border-b-2 border-transparent transition-all">ALARMS RECLAM</button>
        </div>

        <form id="metallForm" class="p-3 md:p-4 space-y-4" oninput="triggerAutoSync()" onchange="triggerAutoSync()">
            <!-- Contexte pièce / lot -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-2 bg-slate-900/60 p-3 rounded-lg border border-slate-700 text-xs">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Lab Operator:</label>
                    <input type="text" id="opName" required oninput="logFillContext()" class="w-full p-1.5 bg-slate-800 border border-slate-600 rounded text-white font-bold outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Part Reference:</label>
                    <input type="text" id="partRef" placeholder="Ex: AXE-018" class="w-full p-1.5 bg-slate-800 border border-slate-600 rounded text-orange-400 font-bold outline-none uppercase">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Heat / Batch No:</label>
                    <input type="text" id="heatNo" placeholder="Batch No" class="w-full p-1.5 bg-slate-800 border border-slate-600 rounded text-white uppercase outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Furnace / Line:</label>
                    <select id="furnaceSelect" class="w-full p-1.5 bg-slate-800 border border-slate-600 rounded text-yellow-400 font-bold outline-none">
                        <option value="Four-1">Four de Trempe 1</option>
                        <option value="Four-2">Four de Trempe 2</option>
                        <option value="Lab">Laboratoire Métallurgie</option>
                    </select>
                </div>
            </div>

            <!-- Section 1 : Hardness & Heat Treatment -->
            <div id="hard-section" class="space-y-4">
                <div class="bg-slate-900/30 p-3 rounded-lg border border-slate-700 space-y-2">
                    <h3 class="text-xs font-bold text-orange-400 uppercase">Hardness Testing (HRC)</h3>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-2 text-xs">
                        <div><label class="block text-[10px] text-slate-400 mb-1">Measured HRC 1:</label><input type="number" step="0.1" id="hrc1" value="58.0" oninput="evalHardness()" class="w-full p-1.5 bg-slate-800 border border-slate-600 rounded text-white text-center font-bold outline-none"></div>
                        <div><label class="block text-[10px] text-slate-400 mb-1">Measured HRC 2:</label><input type="number" step="0.1" id="hrc2" value="58.0" oninput="evalHardness()" class="w-full p-1.5 bg-slate-800 border border-slate-600 rounded text-white text-center font-bold outline-none"></div>
                        <div><label class="block text-[10px] text-slate-400 mb-1">Spec Range HRC:</label>
                            <div class="flex gap-1">
                                <input type="number" step="0.1" id="hrcMin" value="55.0" oninput="evalHardness()" class="w-1/2 p-1.5 bg-slate-800 border border-slate-600 rounded text-amber-400 text-center outline-none">
                                <input type="number" step="0.1" id="hrcMax" value="62.0" oninput="evalHardness()" class="w-1/2 p-1.5 bg-slate-800 border border-slate-600 rounded text-amber-400 text-center outline-none">
                            </div>
                        </div>
                        <div><label class="block text-[10px] text-slate-400 mb-1">Verdict:</label><input type="text" id="hrcVerdict" readonly value="PASS" class="w-full p-1.5 bg-slate-900 border border-slate-700 rounded text-emerald-400 text-center font-bold outline-none"></div>
                    </div>
                </div>

                <div class="bg-slate-900/30 p-3 rounded-lg border border-slate-700 space-y-2">
                    <h3 class="text-xs font-bold text-cyan-400 uppercase">Heat Treatment Validation</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-2 text-xs">
                        <div><label class="block text-[10px] text-slate-400 mb-1">Furnace Temp (°C):</label><input type="number" id="furnaceTemp" value="860" class="w-full p-1.5 bg-slate-800 border border-slate-600 rounded text-white text-center outline-none"></div>
                        <div><label class="block text-[10px] text-slate-400 mb-1">Cycle Time (min):</label><input type="number" id="cycleTime" value="45" class="w-full p-1.5 bg-slate-800 border border-slate-600 rounded text-white text-center outline-none"></div>
                        <div><label class="block text-[10px] text-slate-400 mb-1">Quench Medium:</label>
                            <select id="quenchMedium" class="w-full p-1.5 bg-slate-800 border border-slate-600 rounded text-white outline-none">
                                <option value="OIL">Oil</option><option value="WATER">Water</option><option value="AIR">Air</option><option value="POLYMER">Polymer</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Cycle Compliance:</label>
                        <select id="cycleCompliance" class="w-full p-1.5 bg-slate-800 border border-slate-600 rounded font-bold outline-none" style="color:#34d399;">
                            <option value="CONFORME">CONFORME (recette respectée)</option>
                            <option value="ECART_MINEUR">ÉCART MINEUR (à surveiller)</option>
                            <option value="NON_CONFORME">NON CONFORME (hors recette)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Section 2 : Roughness & Micro-Cracks -->
            <div id="surf-section" class="hidden space-y-4">
                <div class="bg-slate-900/30 p-3 rounded-lg border border-slate-700 space-y-2">
                    <h3 class="text-xs font-bold text-purple-400 uppercase">Surface Roughness (Ra) Compliance</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-2 text-xs">
                        <div><label class="block text-[10px] text-slate-400 mb-1">Measured Ra (µm):</label><input type="number" step="0.01" id="raMeasured" value="0.80" oninput="evalRa()" class="w-full p-1.5 bg-slate-800 border border-slate-600 rounded text-white text-center font-bold outline-none"></div>
                        <div><label class="block text-[10px] text-slate-400 mb-1">Max Allowed Ra (µm):</label><input type="number" step="0.01" id="raMax" value="1.60" oninput="evalRa()" class="w-full p-1.5 bg-slate-800 border border-slate-600 rounded text-amber-400 text-center outline-none"></div>
                        <div><label class="block text-[10px] text-slate-400 mb-1">Verdict:</label><input type="text" id="raVerdict" readonly value="PASS" class="w-full p-1.5 bg-slate-900 border border-slate-700 rounded text-emerald-400 text-center font-bold outline-none"></div>
                    </div>
                </div>

                <div class="bg-slate-900/30 p-3 rounded-lg border border-slate-700 space-y-2">
                    <h3 class="text-xs font-bold text-red-400 uppercase">Micro-Crack Inspection Check-Sheet</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">Inspection Method:</label>
                            <select id="crackMethod" class="w-full p-1.5 bg-slate-800 border border-slate-600 rounded text-white outline-none">
                                <option value="MAGNETIC_PARTICLE">Magnetic Particle Inspection</option>
                                <option value="DYE_PENETRANT">Dye Penetrant</option>
                                <option value="VISUAL">Visual Inspection</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">Result:</label>
                            <select id="crackResult" class="w-full p-1.5 bg-slate-800 border border-slate-600 rounded font-bold outline-none" style="color:#34d399;">
                                <option value="NO_CRACK">🟢 No Crack Detected</option>
                                <option value="MINOR">🟡 Minor Indication — Review</option>
                                <option value="CRACK_DETECTED">🔴 Crack Detected — Reject</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Notes:</label>
                        <textarea id="crackNotes" rows="2" placeholder="Location, size, additional notes..." class="w-full p-2 bg-slate-900 border border-slate-700 rounded text-slate-100 font-mono text-xs outline-none placeholder-slate-600 resize-none"></textarea>
                    </div>
                </div>
            </div>

            <!-- Section 3 : Alarms & Reclamations -->
            <div id="reclam-section" class="hidden space-y-3">
                <div class="bg-slate-900/40 p-4 rounded-lg border border-slate-700 space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                        <h3 class="text-xs font-bold text-red-400 uppercase tracking-wider flex items-center gap-1">
                            <span>🚨 Alarms & Logs Escalation</span>
                        </h3>
                        <span class="text-[9px] text-slate-400 uppercase font-mono">Instant Node Notification</span>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Target Department:</label>
                            <select id="reclamTarget" class="w-full p-2 bg-slate-800 border border-slate-600 rounded text-white font-bold outline-none">
                                <option value="QUALITY">Quality Control Lab</option>
                                <option value="PROD">Production Team</option>
                                <option value="ADMINISTRATION">Administration / Logistics</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Issue Category:</label>
                            <select id="reclamCategory" class="w-full p-2 bg-slate-800 border border-slate-600 rounded text-yellow-400 font-bold outline-none">
                                <option value="HARDNESS_OUT_OF_SPEC">Hardness Out of Spec</option>
                                <option value="CRACK_DETECTED">Micro-Crack Detected</option>
                                <option value="FURNACE_MALFUNCTION">Furnace / Equipment Malfunction</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Detailed Description:</label>
                        <textarea id="reclamText" rows="3" placeholder="Write logs or note details here..." class="w-full p-2 bg-slate-900 border border-slate-700 rounded text-slate-100 font-mono text-xs outline-none placeholder-slate-600 resize-none"></textarea>
                    </div>

                    <div class="pt-1">
                        <button type="button" onclick="sendInstantReclamation()" id="btnSendReclam" class="w-full bg-red-600/20 hover:bg-red-600/40 text-red-400 font-bold py-2.5 rounded text-xs uppercase border border-red-500/40 transition-all tracking-wider flex items-center justify-center gap-2">
                            <span>Trigger Active Alarm 📢</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="pt-2">
                <button type="button" onclick="resetFormInputs()" class="w-full bg-red-600/10 hover:bg-red-600/20 text-red-400 py-2 rounded-lg text-xs uppercase border border-red-500/20 transition-all">Reset Form</button>
            </div>
        </form>
    </div>

    <div class="text-center text-[10px] text-slate-500 font-mono pb-8 uppercase tracking-widest">
        IM JX Smart Suite &bull; Metallurgy Lab Node
    </div>

    <script>
        let syncTimeout = null, initialFillTime = "", initialFillOp = "";

        document.getElementById('repDate').value = new Date().toISOString().split('T')[0];
        setInterval(() => { document.getElementById('liveClock').innerText = new Date().toTimeString().split(' ')[0]; }, 1000);

        function switchTab(id, btnElement) {
            document.getElementById('hard-section').classList.add('hidden');
            document.getElementById('surf-section').classList.add('hidden');
            document.getElementById('reclam-section').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');

            const tabs = btnElement.parentElement.children;
            for (let tab of tabs) {
                tab.classList.remove('bg-slate-800', 'text-orange-400', 'border-orange-500');
                tab.classList.add('text-slate-400', 'border-transparent');
            }
            btnElement.classList.remove('text-slate-400', 'border-transparent');
            btnElement.classList.add('bg-slate-800', 'text-orange-400', 'border-orange-500');
        }

        function logFillContext() {
            const op = document.getElementById('opName').value.trim();
            if (op && !initialFillTime) {
                initialFillTime = new Date().toTimeString().split(' ')[0].substring(0, 5);
                initialFillOp = op;
            }
        }

        function evalHardness() {
            const h1 = parseFloat(document.getElementById('hrc1').value) || 0;
            const h2 = parseFloat(document.getElementById('hrc2').value) || 0;
            const min = parseFloat(document.getElementById('hrcMin').value) || 0;
            const max = parseFloat(document.getElementById('hrcMax').value) || 0;
            const pass = h1 >= min && h1 <= max && h2 >= min && h2 <= max;
            const el = document.getElementById('hrcVerdict');
            el.value = pass ? "PASS" : "FAIL";
            el.className = "w-full p-1.5 bg-slate-900 border border-slate-700 rounded text-center font-bold outline-none " + (pass ? "text-emerald-400" : "text-red-400");
        }

        function evalRa() {
            const meas = parseFloat(document.getElementById('raMeasured').value) || 0;
            const max = parseFloat(document.getElementById('raMax').value) || 0;
            const pass = meas <= max;
            const el = document.getElementById('raVerdict');
            el.value = pass ? "PASS" : "FAIL";
            el.className = "w-full p-1.5 bg-slate-900 border border-slate-700 rounded text-center font-bold outline-none " + (pass ? "text-emerald-400" : "text-red-400");
        }

        function buildMetallPayload(operatorName) {
            let parts = [];
            parts.push("IM_METALLURGY");
            parts.push(document.getElementById('repDate').value);
            parts.push(operatorName);
            parts.push(`PART:${document.getElementById('partRef').value.trim() || 'NA'}`);
            parts.push(`HEAT:${document.getElementById('heatNo').value.trim() || 'NA'}`);
            parts.push(`FURNACE:${document.getElementById('furnaceSelect').value}`);
            parts.push(`HRC:1-${document.getElementById('hrc1').value},2-${document.getElementById('hrc2').value},RANGE-${document.getElementById('hrcMin').value}/${document.getElementById('hrcMax').value},VERDICT-${document.getElementById('hrcVerdict').value}`);
            parts.push(`HEAT_TREAT:Temp-${document.getElementById('furnaceTemp').value},Time-${document.getElementById('cycleTime').value},Quench-${document.getElementById('quenchMedium').value},Compliance-${document.getElementById('cycleCompliance').value}`);
            parts.push(`RA:Meas-${document.getElementById('raMeasured').value},Max-${document.getElementById('raMax').value},VERDICT-${document.getElementById('raVerdict').value}`);
            parts.push(`CRACK:Method-${document.getElementById('crackMethod').value},Result-${document.getElementById('crackResult').value},Notes-${document.getElementById('crackNotes').value.trim() || 'None'}`);
            parts.push(`META_FILL:${initialFillOp || operatorName}@${initialFillTime || '00:00'}`);

            return parts.join(";");
        }

        function triggerAutoSync() {
            const operator = document.getElementById('opName').value.trim();
            if (syncTimeout) clearTimeout(syncTimeout);

            if (!operator) {
                setSyncUIStatus('waiting', 'Waiting for Operator name...');
                return;
            }

            setSyncUIStatus('pending', 'Changes detected... Saving in 1.5s');

            syncTimeout = setTimeout(() => {
                executeBackgroundSync(operator);
            }, 1500);
        }

        function executeBackgroundSync(operatorName) {
            setSyncUIStatus('syncing', 'Syncing lab data to cloud...');
            const payload = buildMetallPayload(operatorName);

            IMJX.sync(payload)
            .then(() => {
                setSyncUIStatus('success', 'All changes autosaved');
                const crackResult = document.getElementById('crackResult').value;
                const hrcFail = document.getElementById('hrcVerdict').value === "FAIL";
                const raFail = document.getElementById('raVerdict').value === "FAIL";
                if (crackResult === "CRACK_DETECTED" || hrcFail || raFail) {
                    const cat = crackResult === "CRACK_DETECTED" ? "CRACK_DETECTED" : "HARDNESS_OUT_OF_SPEC";
                    IMJX.sync(`RECLAM;${document.getElementById('repDate').value};${new Date().toTimeString().split(' ')[0].substring(0,5)};${operatorName};${document.getElementById('partRef').value};QUALITY;${cat};Automatic FAIL verdict on metallurgy lab test.`);
                }
            })
            .catch(err => {
                console.error(err);
                setSyncUIStatus('error', 'Sync Failed. Retrying on next input...');
            });
        }

        function setSyncUIStatus(state, message) {
            const ind = document.getElementById('syncIndicator');
            const txt = document.getElementById('syncStatusText');
            txt.innerText = message;

            if (state === 'success') {
                ind.className = "inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50";
                txt.className = "text-[9px] text-emerald-400 uppercase font-mono tracking-wider";
            } else if (state === 'syncing') {
                ind.className = "inline-block w-2.5 h-2.5 rounded-full bg-blue-500 animate-ping";
                txt.className = "text-[9px] text-blue-400 uppercase font-mono tracking-wider";
            } else if (state === 'pending') {
                ind.className = "inline-block w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse";
                txt.className = "text-[9px] text-amber-400 uppercase font-mono tracking-wider";
            } else if (state === 'waiting') {
                ind.className = "inline-block w-2.5 h-2.5 rounded-full bg-slate-600";
                txt.className = "text-[9px] text-slate-400 uppercase font-mono tracking-wider";
            } else if (state === 'error') {
                ind.className = "inline-block w-2.5 h-2.5 rounded-full bg-red-500 animate-bounce";
                txt.className = "text-[9px] text-red-400 uppercase font-mono tracking-wider font-bold";
            }
        }

        function sendInstantReclamation() {
            const operator = document.getElementById('opName').value.trim();
            if (!operator) { alert("⚠️ أدخل اسم المسؤول أولاً لربطه بالبلاغ!"); return; }

            const target = document.getElementById('reclamTarget').value;
            const category = document.getElementById('reclamCategory').value;
            const textDesc = document.getElementById('reclamText').value.trim() || "No logs.";
            const timestamp = new Date().toTimeString().split(' ')[0].substring(0, 5);

            const reclamPayload = `IM_RECLAM;${document.getElementById('repDate').value};${timestamp};${operator};${document.getElementById('partRef').value.trim() || 'NA'};${target};${category};${textDesc}`;

            const btn = document.getElementById('btnSendReclam');
            btn.innerText = "Transmitting... ⏳";
            btn.disabled = true;

            IMJX.sync(reclamPayload)
            .then(() => {
                alert(`🚨 تم تصعيد البلاغ بنجاح إلى: ${target}`);
                document.getElementById('reclamText').value = "";
                btn.innerText = "Trigger Active Alarm 📢";
                btn.disabled = false;
            })
            .catch(err => {
                console.error(err);
                alert("❌ فشل إرسال بلاغ الريكلاماسيون.");
                btn.innerText = "Trigger Active Alarm 📢";
                btn.disabled = false;
            });
        }

        function resetFormInputs() {
            if (confirm("هل أنت متأكد من مسح البيانات بالكامل؟")) {
                document.getElementById('metallForm').reset();
                initAll();
            }
        }

        function initAll() {
            evalHardness();
            evalRa();
            setSyncUIStatus('waiting', 'Ready. Enter Operator name to activate sync node.');
        }

        initAll();
    </script>
</body>
</html>
